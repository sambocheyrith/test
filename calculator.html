<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-400 flex items-center justify-center h-screen">

    <div class="bg-black p-6 rounded-2xl shadow-2xl w-80">
        
        <div class="text-right mb-6 px-2">
            <div id="prev" class="text-white/80 text-md font-light truncate"></div>
            <div id="display" class="text-white text-5xl font-light truncate">0</div>
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button onclick="clearDisplay()" class="col-span-2 bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">AC</button>
            <button onclick="deleteLast()" class="bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">DEL</button>
            <button class="operation bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">/</button>

            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">1</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">2</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">3</button>
            <button class="operation bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">+</button>

            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">4</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">5</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">6</button>
            <button class="operation bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">-</button>

            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">7</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">8</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">9</button>
            <button class="operation bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">*</button>

            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">.</button>
            <button class="number bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">0</button>
            <button onclick="result()" class="col-span-2 bg-zinc-900 text-white py-4 rounded-xl text-xl hover:bg-gray-600 transition">=</button>
        </div>
    </div>

    <script>
        const numbers = document.querySelectorAll(".number");
        const operation = document.querySelectorAll(".operation");
        const display = document.getElementById('display');
        const prev = document.getElementById('prev');
        let opr = "";
        let isOperation = false;

        numbers.forEach(number => {
            number.addEventListener("click", () => {
                if(display.innerHTML.includes(".") && number.innerHTML == ".")  {
                    return;
                }

                if( number.innerHTML == ".") {
                    display.innerText +=  number.innerHTML;
                } else {
                    if (display.innerText === '0') {
                        display.innerText =  number.innerHTML;
                    } else {
                        display.innerText +=  number.innerHTML;
                    }
                }
            })
        })

        operation.forEach(op => {
            op.addEventListener("click", () => {

                if(isOperation == true) {
                    return;
                }

                prev.innerHTML = display.innerHTML + op.innerHTML;
                display.innerHTML = 0;
                isOperation = true;
                opr = op.innerHTML;
 
            })
        })

        function clearDisplay() {
            display.innerText = '0';
            prev.innerHTML = "";
            isOperation = false;
            opr = "";
        }

        function deleteLast() {
            if (display.innerText.length > 1) {
                display.innerText = display.innerText.slice(0, -1);
            } else {
                display.innerText = '0';
            }
        }

        function result () {
            let amount = 0;
            if(opr == "+") {
                  amount = parseFloat(prev.innerHTML) + parseFloat(display.innerHTML);
            } else if (opr == "-"){
                  amount = parseFloat(prev.innerHTML) - parseFloat(display.innerHTML);
            }
            else if (opr == "*"){
                  amount = parseFloat(prev.innerHTML) * parseFloat(display.innerHTML);
            }
            else if (opr == "/"){
                  amount = parseFloat(prev.innerHTML) / parseFloat(display.innerHTML);
            }

            prev.innerHTML = prev.innerHTML + display.innerHTML;
            display.innerHTML = amount;
          
            isOperation = false;
            opr = "";
        }
    </script>
</body>
</html>
