<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .ads {
            background-color: blue;
            padding: 20px;
            color: white;
            transform: translateY(-100%);
            animation: 
            pushDown 1s ease forwards,
            changeToWhite 1s ease forwards;
            animation-delay: 0s, 2s;
        }

        .float-up {
            transform: translateY(200px);
            opacity: 0;
            animation: floatUp 0.8s ease-in forwards;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .delay-1 {
            animation-delay: 0.5s;
        }

        .delay-2 {
            animation-delay: 0.8s;
        }

        .scroll {
            transform: translateX(0);
            animation: scroll 20s linear infinite;
            display: flex;
            width: 100%;
            gap: 20px;

        }

        @keyframes scroll {
            to {
                transform: translateX(-100%);
            }
        }


        @keyframes pushDown {
            to {
                transform: translateY(0);
            }
        }

        @keyframes changeToWhite {
            to {
                background-color: rgb(218, 218, 218);
                color: black;
            }
        }


        @keyframes floatUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="ads">
        hello world
    </div>
    <br>

    <h1 class="float-up">Buy now</h1>
    <div>
        <img src="macbook.jpg" alt="" height="300" class="float-up delay-1">
        <img src="macbook 2.jpg" alt="" height="300" class="float-up delay-2">
    </div>

     <div class="scroll">
        <img src="macbook.jpg" alt="" height="300" class="">
        <img src="macbook 2.jpg" alt="" height="300" class="">
         <img src="imac.jpg" alt="" height="300" class="">
           <img src="macbook.jpg" alt="" height="300" class="">
        <img src="macbook 2.jpg" alt="" height="300" class="">
         <img src="imac.jpg" alt="" height="300" class="">
           <img src="macbook.jpg" alt="" height="300" class="">
        <img src="macbook 2.jpg" alt="" height="300" class="">
         <img src="imac.jpg" alt="" height="300" class="">
    </div>

    <iframe src="https://news.sabay.com.kh/" width="100%" height="500px" frameborder="0"></iframe>
    <embed src="https://www.example.com" width="200" height="200 ">

</body>
</html>
